<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金山萬里一日遊｜HTML Tool Hub</title><link rel="stylesheet" href="../../css/style.css"></head>
<body><header><a class="brand" href="../../index.html">◈ TOOL HUB <small>V1.0</small></a><nav><span id="identity">尚未登入</span><button id="login">Google 登入</button><button id="logout" hidden>登出</button></nav></header><main><a class="back" href="../../index.html">← 回到工具中心</a><section class="travel-hero"><p class="eyebrow">A DAY ON THE NORTH COAST</p><h1>金山萬里<br>一日遊</h1><p id="space-name">海風、老街，與一起出發的人。</p><span id="role" class="pill">等待登入</span></section><p id="notice" class="notice" role="status" aria-live="polite">正在開啟行程…</p><div class="section-head"><h2>這一天，慢慢走</h2><div class="actions"><button id="add" hidden>＋ 新增行程</button><button id="seed" class="secondary" hidden>加入示範行程</button></div></div><p class="muted">每個景點獨立儲存。時間為規劃值，營業資訊、票價及交通請於出發前確認。</p><div id="records" class="timeline"></div>
